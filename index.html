<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/eventstratlogo-white.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a855f7" />
    <title>Eventstrat CLM — Client & Tender Workflow</title>
    <meta
      name="description"
      content="Eventstrat's client lifecycle platform. Move tenders/projects from intake to delivery, fan work out to specialist teams, and track every project in one place."
    />

    <!-- Open Graph (WhatsApp, LinkedIn, Slack, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eventstrat CLM" />
    <meta property="og:title" content="Eventstrat CLM — Client & Tender Workflow" />
    <meta
      property="og:description"
      content="Run tenders, coordinate teams, and ship projects end-to-end on Eventstrat's client lifecycle platform."
    />
    <meta property="og:url" content="https://clm.eventstrat.ai/" />
    <meta property="og:image" content="https://clm.eventstrat.ai/es-logo.png" />
    <meta property="og:image:alt" content="Eventstrat" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eventstrat CLM — Client & Tender Workflow" />
    <meta
      name="twitter:description"
      content="Run tenders, coordinate teams, and ship projects end-to-end on Eventstrat's client lifecycle platform."
    />
    <meta name="twitter:image" content="https://clm.eventstrat.ai/es-logo.png" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem('theme') || 'system';
          var sysLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var resolved = m === 'system' ? (sysLight ? 'light' : 'dark') : m;
          if (resolved === 'light') document.documentElement.classList.add('light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
